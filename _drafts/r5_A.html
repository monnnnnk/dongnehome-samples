<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>동네홈 — 동네 가게 홈페이지를 만듭니다 (r5 시안 A)</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="r5.css">
<style>
body{overflow:hidden;height:100svh}
.bar{position:fixed;inset:0 0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;padding:14px var(--m) 0;z-index:5}
.bar .r{justify-self:end;display:flex;gap:16px;align-items:flex-start}
.bar nav{display:flex;gap:14px}.bar nav a{padding:0 0 14px}
.bar nav a:hover{text-decoration:underline;text-underline-offset:3px}
.focal{position:absolute;left:0;right:0;top:calc(var(--top) * 1px);display:flex;flex-direction:column;align-items:center;text-align:center;gap:0}
:root{--top:62;--dh:min(46svh,410px)}
.focal .mark{width:54px;height:54px;margin-bottom:18px}
.focal .wm{font-size:clamp(64px,8.4vw,124px)}
.focal .wm span{display:inline-block}
.focal .line{margin-top:20px;font:600 clamp(19px,1.75vw,25px)/1.35 var(--sans);letter-spacing:-.02em}
.focal .sub{margin-top:8px}
.strip{position:absolute;left:0;right:0;bottom:var(--m);height:calc(var(--dh) + 26px);overflow:hidden;cursor:grab;touch-action:pan-y}
.strip.drag{cursor:grabbing}
.track{display:flex;align-items:flex-end;gap:24px;height:100%;padding-left:var(--m);will-change:transform}
.it{flex:none;display:flex;flex-direction:column;gap:10px;text-decoration:none}
.it .cap{display:flex;justify-content:space-between;gap:12px}
.it.l{width:calc((var(--dh) - 26px - 16px) * 1.6 + 14px)}
.it.p{width:calc((var(--dh) - 26px - 12px) * 390 / 844 + 12px)}
.it .dv{transition:transform .6s var(--out)}
.it:hover .dv{transform:translateY(-8px)}
.hint{position:absolute;right:var(--m);bottom:calc(var(--m) + var(--dh) + 34px)}
/* intro */
.js .mark path,.js .mark rect,.js .mark line{stroke-dasharray:140;stroke-dashoffset:140;transition:stroke-dashoffset 1s var(--io)}
.js .mark .dot{opacity:0;transition:opacity .3s 1s}
.js .focal .wm span{clip-path:inset(0 0 100% 0);transform:translateY(30%);transition:clip-path .9s var(--io),transform .9s var(--io)}
.js .focal .line,.js .focal .sub,.js .bar,.js .hint{opacity:0;transition:opacity .7s ease-out}
.js .it{transform:translateY(calc(var(--dh) + 60px));transition:transform 1.05s var(--io)}
.go .mark path,.go .mark rect,.go .mark line{stroke-dashoffset:0}.go .mark .dot{opacity:1}
.go .focal .wm span{clip-path:inset(0 0 -10% 0);transform:none}
.go .focal .line{opacity:1;transition-delay:.9s}.go .focal .sub{opacity:1;transition-delay:1.1s}
.go .it{transform:none}
.go .bar,.go .hint{opacity:1;transition-delay:2.1s}
@media (max-width:899px){
 :root{--top:84;--dh:min(52svh,440px)}
 .bar{grid-template-columns:1fr auto}.bar .c{display:none}
 .bar nav{gap:10px}
 .focal .mark{width:40px;height:40px;margin-bottom:12px}
 .focal .wm{font-size:68px}
 .focal .line{font-size:19px;margin-top:14px}
 .track{gap:12px}
 .it.l{display:none}
 .it .cap{flex-direction:column;gap:2px}.it .cap span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .hint{display:none}
}
@media (prefers-reduced-motion:reduce){.js *{transition:none!important}.strip{overflow-x:auto}}
</style></head>
<body>
<a class="skip" href="#work">작업 바로 보기</a>
<header class="bar lb">
 <a href="#" class="l"><b>동네홈</b><br><span class="mu">디자인·제작 재영</span></a>
 <span class="c mu">카페 · 미용실 · 식당</span>
 <div class="r"><nav aria-label="주요"><a href="#work">작업</a><a href="#">가격</a><a href="#">문의</a></nav><span class="tag">데모·가상 매장 샘플</span></div>
</header>
<main>
 <section class="focal" aria-label="동네홈 소개">
  <svg class="mark" viewBox="0 0 48 48" aria-hidden="true"><path d="M3 21 24 4 45 21"/><rect x="9" y="17" width="30" height="27"/><line x1="9" y1="25" x2="39" y2="25"/><rect class="dot" x="13" y="20" width="3" height="2.4"/></svg>
  <h1><span class="wm" aria-label="동네홈"><span>동</span><span>네</span><span>홈</span></span></h1>
  <p class="line">동네 가게 홈페이지를 만듭니다</p>
  <p class="sub lb mu">아래는 실제로 만든 데모 페이지 3종입니다 — 카페 · 미용실 · 라멘집</p>
 </section>
 <p class="hint lb mu" aria-hidden="true">스크롤·드래그 →</p>
 <section class="strip" id="work" aria-label="작업">
  <div class="track" id="track"></div>
 </section>
</main>
<script>
document.documentElement.classList.add('js');
const S={cafe:['소담별 커피','카페'],salon:['GYEOL 결 헤어','미용실'],ramen:['라멘 소라','라멘집']};
const SEC={d0:'첫 화면',d1:'메뉴',d2:'주요 섹션',m0:'모바일 첫 화면',m1:'모바일 메뉴',m2:'모바일 섹션'};
const L=[['cafe','d0'],['salon','m0'],['ramen','d0'],['cafe','m0'],['salon','d0'],['ramen','m0'],['cafe','d1'],['salon','m1'],['ramen','d2'],['cafe','m1'],['salon','d2'],['ramen','m1']];
const href={cafe:'../cafe/',salon:'../salon/',ramen:'../ramen/'};
const tr=document.getElementById('track');
function mk(i,[s,k],clone){const lap=k[0]==='d';const a=document.createElement('a');a.className='it '+(lap?'l':'p');a.href=href[s];
 if(clone){a.setAttribute('aria-hidden','true');a.tabIndex=-1}
 a.innerHTML=`<span class="cap lb"><span>${String(i%12+1).padStart(2,'0')} ${S[s][0]}</span><span class="mu">${S[s][1]} · ${SEC[k]}</span></span>`+
 (lap?`<span class="dv lt"><span class="scr" style="display:block"><div><img src="img/${s}_${k}_lt.jpg" alt="${clone?'':S[s][0]+' '+SEC[k]+' 화면'}" ${i>3?'loading="lazy"':''}></div></span><span class="base" style="display:block"></span></span>`
      :`<span class="dv ph"><div><img src="img/${s}_${k}_ph.jpg" alt="${clone?'':S[s][0]+' '+SEC[k]+' 화면'}" ${i>3?'loading="lazy"':''}></div></span>`);
 a.style.transitionDelay=(1.15+Math.min(i,6)*.07)+'s';return a}
L.forEach((x,i)=>tr.appendChild(mk(i,x,false)));L.forEach((x,i)=>tr.appendChild(mk(i+12,x,true)));
const rm=matchMedia('(prefers-reduced-motion: reduce)').matches;
let setW=0,t=0,cur=0,v=0,drag=null;
function meas(){const its=tr.children;setW=its[12].offsetLeft-its[0].offsetLeft}
addEventListener('load',meas);addEventListener('resize',meas);meas();
if(!rm){
 addEventListener('wheel',e=>{t+=(Math.abs(e.deltaY)>Math.abs(e.deltaX)?e.deltaY:e.deltaX)*1.4},{passive:true});
 const st=document.querySelector('.strip');
 st.addEventListener('pointerdown',e=>{drag={x:e.clientX,t0:t,lx:e.clientX,moved:0};st.classList.add('drag');st.setPointerCapture(e.pointerId)});
 st.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x;drag.moved=Math.max(drag.moved,Math.abs(dx));v=drag.lx-e.clientX;drag.lx=e.clientX;t=drag.t0-dx*1.2});
 const up=()=>{if(!drag)return;t+=v*8;st.classList.remove('drag');setTimeout(()=>drag=null,0)};
 st.addEventListener('pointerup',up);st.addEventListener('pointercancel',up);
 st.addEventListener('click',e=>{if(drag&&drag.moved>6)e.preventDefault()},true);
 (function f(){cur+=(t-cur)*.1;const x=setW?((cur%setW)+setW)%setW:0;tr.style.transform=`translate3d(${-x}px,0,0)`;requestAnimationFrame(f)})();
}
document.fonts.ready.then(()=>requestAnimationFrame(()=>setTimeout(()=>document.documentElement.classList.add('go'),rm?0:250)));
</script>
</body></html>
